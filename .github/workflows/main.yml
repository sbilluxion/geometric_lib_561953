name: CI

on:
  push:
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: python tests/report.py --os "${{ matrix.os }}" --out "report-${{ matrix.os }}.json"

      - name: Save results for the report card
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: report-${{ matrix.os }}
          path: report-${{ matrix.os }}.json

  report-card:
    needs: unit-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to comment on the commit

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Download results
        uses: actions/download-artifact@v7
        with:
          pattern: report-*
          path: reports
          merge-multiple: true

      - name: Post report card to the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tests/make_report.py "${{ github.sha }}" reports/*.json > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md
